# USCIS Tracker — self-hosted. One command:  docker compose up -d
#
# To run the prebuilt image instead of building locally, replace `build: .` below
# with:  image: ghcr.io/sven97/uscis-tracker:latest
services:
  app:
    build: .
    # image: ghcr.io/sven97/uscis-tracker:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    depends_on:
      - flaresolverr
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
